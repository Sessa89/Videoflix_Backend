<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ subject }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        background: #f6f7f9;
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        color: #222;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .header {
        background: #111827;
        color: #fff;
        padding: 20px 24px;
        font-size: 18px;
        font-weight: bold;
      }
      .content {
        padding: 24px;
        font-size: 15px;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 10px;
        text-decoration: none;
        background: #111827;
        color: #fff;
      }
      .footer {
        color: #6b7280;
        font-size: 12px;
        padding: 16px 24px;
      }
      .muted {
        color: #6b7280;
      }
      @media (max-width: 600px) {
        .content,
        .footer,
        .header {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">{{ brand_name|default:'Videoflix' }}</div>
      <div class="content">
        {% block content %}
        {% endblock %}
      </div>
      <div class="footer">{{ brand_name|default:'Videoflix' }} • This is an automated message. Do not reply.</div>
    </div>
  </body>
</html>
